repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff-format
        args: []
      - id: ruff-check
        args: [--extend-select, I, --fix]
  - repo: local
    hooks:
      - id: pyrefly-check
        name: Pyrefly (type checking)
        entry: uv run pyrefly check
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        stages: [pre-push]
      - id: vulture
        name: Vulture (dead code detection)
        entry: uv run vulture src/ --min-confidence 80
        language: system
        pass_filenames: false
